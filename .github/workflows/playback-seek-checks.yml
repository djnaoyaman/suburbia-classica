name: Check playback seeking
on:
  pull_request:
    paths:
      - index.html
      - playback-seek.js
      - playback-seek.css
      - tests/test-playback-seek.cjs
      - .github/workflows/playback-seek-checks.yml
  push:
    branches: [main]
    paths:
      - index.html
      - playback-seek.js
      - playback-seek.css
      - tests/test-playback-seek.cjs
      - .github/workflows/playback-seek-checks.yml
permissions:
  contents: read
jobs:
  seek-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test-playback-seek.cjs
      - run: node --test tests/entry-selection.test.cjs
      - run: node tests/test-visual-timing.cjs && node tests/test-visual-timing-lifecycle.cjs
