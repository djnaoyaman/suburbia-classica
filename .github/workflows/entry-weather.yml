name: Refresh entry weather
on:
  schedule:
    - cron: '17 14 * * *' # 23:17 JST: publish tomorrow before the date changes.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/entry-weather.yml
      - scripts/update-entry-weather.cjs
      - entry-selection.js
  pull_request:
    paths:
      - .github/workflows/entry-weather.yml
      - scripts/update-entry-weather.cjs
      - entry-selection.js
      - tests/entry-selection.test.cjs
      - index.html
permissions:
  contents: read
concurrency:
  group: entry-weather
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/entry-selection.test.cjs
  refresh:
    if: github.event_name != 'pull_request'
    needs: checks
    permissions:
      contents: write
      pages: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch fixed-city daily forecasts
        run: node scripts/update-entry-weather.cjs
      - name: Publish only the weather cache
        id: publish
        run: |
          git add data/entry-weather.json
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only)" = 'data/entry-weather.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh fixed-city entry weather'
          git pull --rebase origin main
          test "$(git diff --name-only HEAD^ HEAD)" = 'data/entry-weather.json'
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Request the existing branch-based Pages build
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
