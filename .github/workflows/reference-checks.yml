name: Check reference sections
on:
  pull_request:
    paths: ['index.html', 'reference-*.js', 'songs/**', 'scripts/build-reference-sections.cjs', 'tests/test-reference-*.cjs', '.github/workflows/reference-checks.yml']
  push:
    branches: [main]
    paths: ['index.html', 'reference-*.js', 'songs/**', 'scripts/build-reference-sections.cjs', 'tests/test-reference-*.cjs', '.github/workflows/reference-checks.yml']
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test-reference-sections.cjs
      - run: node scripts/build-reference-sections.cjs && git diff --exit-code -- songs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/test-reference-browser.cjs
      - run: node tests/test-jesu-art-connection.cjs
      - run: node tests/test-youkai-full-name-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-mobile-screenshots
          path: test-artifacts/
          if-no-files-found: warn
