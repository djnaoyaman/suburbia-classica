<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUBURBIA CLASSICA — A Mellow Classical Selection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Noto+Serif+JP:wght@400;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14161c; --panel:#1b1e26; --line:#2c303b; --text:#e8e4dc; --sub:#9a97a0;
  --accent:#d9b382; --accent2:#7f9bbf;
  --serif:"Noto Serif JP","游明朝","Yu Mincho",serif; --sans:"Noto Sans JP","游ゴシック","Yu Gothic",sans-serif;
  --en:"Cormorant Garamond","Noto Serif JP",serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.9}
a{color:inherit}
header{padding:22px 24px 18px;border-bottom:1px solid var(--line)}
header .logo{font-family:var(--en);font-weight:600;font-size:28px;letter-spacing:.28em;margin:0;line-height:1.2}
header .logo a{text-decoration:none}
header .tag{font-family:var(--en);font-size:15px;letter-spacing:.2em;color:var(--accent);margin-top:2px}
#banner{display:none;background:#3a2a1a;color:#f0d9b5;padding:10px 24px;font-size:13px}
.layout{display:grid;grid-template-columns:380px 1fr;gap:32px;max-width:1200px;margin:0 auto;padding:24px}
@media(max-width:860px){.layout{grid-template-columns:1fr;padding:16px}}
.player{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;align-self:start}
@media(min-width:861px){.player{position:sticky;top:16px}}
.vwrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden}
.vwrap iframe,.vwrap #yt{position:absolute;inset:0;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,11,15,.72);z-index:2;cursor:pointer}
.overlay span{border:1px solid var(--accent);color:var(--accent);padding:10px 22px;border-radius:999px;font-family:var(--en);font-size:17px;letter-spacing:.18em}
.overlay.hide{display:none}
.now{margin:12px 2px 6px}
.now .label{font-size:11px;color:var(--sub);letter-spacing:.2em}
.now .t{font-family:var(--serif);font-size:16px}
.now .c{font-size:12px;color:var(--sub)}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
button,.btn{background:none;border:1px solid var(--line);color:var(--text);padding:6px 14px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--accent);color:var(--accent)}
label.auto{font-size:12px;color:var(--sub);margin-left:auto;display:flex;gap:6px;align-items:center;cursor:pointer}
.status{font-size:12px;color:var(--accent2);min-height:1.4em;margin-top:6px}
h2{font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:.12em;color:var(--accent);margin:36px 0 10px;padding-top:6px;border-top:1px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.chip{font-size:12px;padding:3px 12px;border:1px solid var(--line);border-radius:999px;color:var(--sub);cursor:pointer;background:none}
.chip.on{border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{display:block;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;transition:border-color .2s}
.card:hover{border-color:var(--accent)}
.card .no{font-size:11px;color:var(--sub);letter-spacing:.2em}
.card .tt{font-family:var(--serif);font-size:16px;margin:2px 0}
.card .cc{font-size:12px;color:var(--sub)}
.card .tg{margin-top:8px;font-size:11px;color:var(--accent2)}
.card.playing{border-color:var(--accent)}
.song h1{font-family:var(--serif);font-weight:600;font-size:26px;margin:0 0 2px;line-height:1.4}
.song .en{color:var(--sub);font-size:13px;margin-bottom:16px;font-family:var(--en);font-size:16px;letter-spacing:.04em}
.lead{font-family:var(--serif);font-size:16px}
.meta{display:grid;grid-template-columns:110px 1fr;border-top:1px solid var(--line);margin:16px 0}
.meta div{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.meta .k{color:var(--sub);font-size:12px;letter-spacing:.1em}
.pend{color:#7b7882}
.steps{list-style:none;padding:0;margin:0}
.steps li{padding:10px 0 10px 14px;border-left:2px solid var(--line);margin-bottom:6px;font-size:14px}
.steps li b{display:block;font-weight:500;color:var(--accent2);font-size:13px}
ul.plain{margin:0;padding-left:1.2em;font-size:14px}
ul.plain li{margin-bottom:8px}
ul.plain small,.note{color:var(--sub);font-size:12px}
a.ilink{color:var(--accent2);text-decoration:none;border-bottom:1px solid rgba(127,155,191,.4)}
a.ilink:hover{color:var(--accent);border-color:var(--accent)}
a.chip{text-decoration:none;display:inline-block}
a.chip.dim{opacity:.55}
.cath{display:flex;align-items:baseline;gap:10px}
.cath span{font-family:var(--en);font-size:22px;color:var(--text);letter-spacing:.1em}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:36px;flex-wrap:wrap}
.links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.src a{display:block;font-size:12px;color:var(--sub);word-break:break-all;margin-bottom:2px}
p{margin:0 0 12px;font-size:14px}
.lead{font-size:16px}
footer{max-width:1200px;margin:0 auto;padding:8px 24px 40px;color:var(--sub);font-size:12px}
.opts{margin-left:auto;display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.opts label{font-size:12px;color:var(--sub);display:flex;gap:6px;align-items:center;cursor:pointer}
/* ---- screensaver / display mode ---- */
#ss{position:fixed;inset:0;z-index:100;background:#000;opacity:0;visibility:hidden;transition:opacity 1.2s ease,visibility 0s linear 1.2s;color:#f3ece0}
#ss.on{opacity:1;visibility:visible;transition:opacity 1.2s ease;cursor:none}
#ss.light{color:#2b2622}
#ssc{position:absolute;inset:0;width:100%;height:100%;transition:opacity .8s ease}
#ss .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.38) 100%)}
#ss.light .vig{background:radial-gradient(ellipse at center,transparent 60%,rgba(60,40,20,.18) 100%)}
#ss .brand{position:absolute;top:36px;left:44px;font-family:var(--en);font-weight:500;letter-spacing:.42em;font-size:13px;opacity:.7}
#ss .info{position:absolute;left:44px;bottom:48px;max-width:70vw;transition:opacity .8s ease}
#ss .info .np{font-family:var(--en);letter-spacing:.34em;font-size:12px;opacity:.65;margin-bottom:10px}
#ss .info .tj{font-family:var(--serif);font-weight:400;font-size:clamp(22px,3.2vw,40px);line-height:1.35;letter-spacing:.06em}
#ss .info .te{font-family:var(--en);font-style:italic;font-size:clamp(15px,1.7vw,22px);opacity:.78;margin-top:4px}
#ss .info .tc{font-family:var(--en);letter-spacing:.24em;font-size:13px;margin-top:14px;opacity:.65;text-transform:uppercase}
#ss .info .tc i{display:inline-block;width:36px;height:1px;background:currentColor;vertical-align:middle;margin-right:12px;opacity:.6}
@media(max-width:600px){#ss .brand{left:24px;top:24px}#ss .info{left:24px;bottom:32px}}
</style>
</head>

 story:"ベートーヴェンが39歳だった1810年4月27日付とされる小品。主旋律の原型は1808年ごろ、交響曲第6番のスケッチ帳に16小節の旋律として書き留められており、後の形とは少し違っていた。1810年春には全曲の草稿（ボンのベートーヴェン・ハウス所蔵、BH 116）が書かれ、同じ紙に『エグモント』や行進曲WoO 19のスケッチがあることから時期が絞られる。1822年にはこの草稿に手直しが入り「12番」の番号が振られたため、バガテル集の最終曲にする構想があったらしいが、完成しなかった。生前は出版されず、自筆譜は失われている。世に出たのは没後40年の1867年で、ルートヴィヒ・ノールが書簡集の中で紹介した。ノールの説明では、楽譜はもともとテレーゼ・マルファッティの遺品で、のちにミュンヘンのバベッテ・ブレードルが持っていた。",

{

 story:"1801年、ベートーヴェンが30歳のころに完成した作品で、委嘱を受けた証拠はない。作品27の2曲（第13番と第14番）には、どちらも「幻想曲風ソナタ」という題が付けられた。伝統的な「急−緩−急」を避け、緩やかな楽章から始めて速度を段階的に上げ、重心を終楽章に置いた配置になっている。献呈相手のジュリエッタ・グイチャルディは、1801年11月にヴェーゲラーへ宛てた手紙で恋心をほのめかした弟子だが、この献呈は当初からの意図ではなく、本来グイチャルディに捧げる予定だったロンドOp.51-2をリヒノフスキー家の令嬢に贈ることになったため、代わりにこのソナタが充てられたとされる。",

 ded:"伯爵令嬢ジュリエッタ（ジュリー）・グイチャルディ。ただし献呈は最終段階で決まったもので、当初グイチャルディに予定されていたのはロンドOp.51-2（セイヤーによる）。",

 structure:[
  ["冒頭指示（Adagio sostenuto）","「全曲を極めて繊細に、ダンパーなしで演奏すること」という指示で始まる。現代ピアノではサステインペダルを使い続ける解釈になるが、響きが濁りやすい。形式の見方は、三部形式とする説や、変則的なソナタ形式とする説に分かれる。"],
  ["序奏とA主題","低音のオクターブに続き、途切れない三連符の伴奏の上に付点リズムの旋律が置かれる。葬送を思わせる、とする見方もある。"],
  ["B主題と中間部","ロ長調付近でB主題が出る。中間部ではA主題の素材から出発し、旋律的な要素が薄れ、三連符が高音域へ弧を描いて上り下りする。"],

 features:"嬰ハ短調、2/2拍子。右手の三連符が最後まで途切れず、この音型が全体のトーンを決める。旋律は主に低音側で語られ、右手は同じ音型を保つ。音量はpp〜pの範囲にとどまる。弱音と持続音を重ねたペダルの響きが主役で、旋律の動きは小さい。この三連符の音型は終楽章のアルペッジョの動機へ発展し、全曲の統一にも関わる。",
 perf:"最大の課題はペダル。現代のピアノは当時より余韻が長く、楽譜どおりの踏みっぱなしでは和声が濁る。対策として、和声の変わり目ごとに踏み替える、ハーフペダルを使う、低音を無音で押さえてソステヌートペダルで保持する、などの方法がある。トーヴィは、速いテンポを選んで12/8のようになる解釈を戒めた。全曲では終楽章が技術・持久力ともに最も難しい。",

{
 id:"tristesse", title:"別れの曲（練習曲 Op.10-3）", en:"Étude Op.10 No.3 in E major “Tristesse”",
 composer:"ショパン", era:"ロマン派", year:"1832年", opus:"Op.10-3", key:"ホ長調・2/4拍子", form:"練習曲（ピアノ独奏）／三部形式", mood:["切ない","穏やか"],
 summary:"速さを競う練習曲とは正反対に、遅いテンポで旋律を歌わせる練習曲。右手が旋律・内声・伴奏の三層を受け持つ。",
 diff:"ヘンレ難易度 7（difficult）。ABRSMグレードは未確認。",
 story:"1832年、22歳のショパンがパリで書いた曲。Op.10の練習曲集は1829年ごろから数年かけて書き継がれ、この曲は後期にあたる。標題は「練習曲」だが、従来の練習曲と違い、遅いテンポで旋律を歌わせる曲である。伝記作家ニークスによると、弟子のグートマンがこの曲をさらっていたとき、ショパンは「これほど美しい旋律は二度と書けないだろう」と言い、両手を組んで「ああ、わが祖国よ」と叫んだという。望郷の思いを重ねて語られる逸話だが、後年の伝記に載ったもので、同時代の記録は確認できていない。自筆譜は2種類残り、速度標語はVivace、次いでVivace ma non troppoと書かれている。出版時にショパンがLento ma non troppo（8分音符=100）へ改めたとみられる。2つ目の自筆譜の末尾には、第4番へ間を置かずに入るアタッカの指示がある。",
 pub:"作曲は1832年（曲集Op.10全体は1829〜32年）。Op.10は1833年に出版（英語版Wikipediaはパリのシュレザンジェ版、1833年6月を引く）。初演は未確認。自筆譜はニューヨークのレーマン・コレクション（Vivace）とワルシャワのショパン博物館（Vivace ma non troppo）に1種ずつ。練習曲集の世界初録音は1927年とされる（日本語版Wikipedia脚注）。",
 ded:"Op.10の曲集全体がフランツ・リストに献呈されている。この曲だけの献呈は確認できなかった。",
 nameOrigin:"日本で定着した「別れの曲」という通称は、1934年のドイツ映画『Abschiedswalzer』（邦題『別れの曲』、ゲツァ・フォン・ボルヴァリー監督）の邦題に由来する。この映画はショパンの伝記映画で、本曲が主題曲に使われた。日本では1935年にキャストを替えたフランス語版（La chanson de l'adieu）が公開されて大ヒットし、これを機に本曲が「別れの曲」と呼ばれるようになった。海外の通称は「Tristesse（悲しみ）」で、フランス語圏では「L'intimité」、英語圏では「Farewell」とも呼ぶ。いずれもショパン自身が付けたものではない。",
 structure:[
  ["A部（冒頭〜約20小節、Lento ma non troppo）","右手の最上声が息の長い旋律を歌い、内声と細かい16分音符の揺れが同じ手で伴奏を務める。左手は和音とシンコペーションで支える。楽句の構成は(5+3)+(5+7)小節という非対称型。声部ごとに別々のクレッシェンド・ディミヌエンド記号が付くのも新しい点。"],
  ["B部（poco più animato、約21〜61小節）","旋律と伴奏が重音の連なりに融合する中間部。8小節の楽句が5つ並び、第3楽句は減7と三全音の連続で転調が激しい。第4楽句（46〜53小節）は両手の6度重音によるクライマックス。第5楽句（54〜61小節）は属七の和音を引き延ばしてA部再現へつなぐ。"],
  ["A'部と終結","A部が短縮して戻り、静かに閉じる。自筆譜末尾には第4番へのアタッカ指示がある。"]],
 features:"三部形式（A-B-A'）で、夜想曲のような歌の曲想が指摘されることが多い。A部の伴奏は右手の細かい揺れと左手のシンコペーションが重なる。旋律には音の反復が多く、第4〜5小節の長3度の揺れはドビュッシー的な響きを先取りしているとカゼッラが述べている。B部は減7の和音と三全音を連ね、ホ長調を保ちつつ半音階的な色合いが強まる。ペダル指示は自筆譜にも原典版にも見当たらない。",
 perf:"右手は弱い3本の指（中指・薬指・小指）が旋律、親指と人差し指が16分音符の伴奏を受け持つ。一つの手で声部ごとに音量とタッチを変えることが課題。コルトーは、上声をforteのレガート、中声をmp、最下声の16分音符をppのスタッカートにして別々に練習することを勧める。指定のテンポは8分音符=100だが、エキエルは、実演は常にこれより遅いか、はるかに遅いと述べる。B部の6度重音のクライマックスは、A部よりずっと速く弾かれるのが通例。",
 recs:[["ヴィルヘルム・バックハウス","1927","練習曲集の世界初録音とされる（日本語版Wikipedia脚注）。レーベルは未確認。"]],
 films:[
  ["別れの曲 (Abschiedswalzer / La chanson de l'adieu)","1934","ショパンの伝記映画。恋人コンスタンツィアの18歳の誕生日に贈る曲として、本曲が主題曲に使われる。日本では1935年にフランス語版が公開。","https://ja.wikipedia.org/wiki/別れの曲_(映画)"],
  ["さびしんぼう","年未確認","原曲が全編にわたって使われ、エンディングではアレンジ版が歌入りで流れる。","https://ja.wikipedia.org/wiki/練習曲作品10-3_(ショパン)"],
  ["男はつらいよ（TVドラマ版最終回）","年未確認","マドンナ・冬子の家の縁側で、寅次郎が婚約者の存在を知る場面で、隣家のピアノから流れる。1973年の映画『私の寅さん』で再現された。","https://ja.wikipedia.org/wiki/練習曲作品10-3_(ショパン)"],

 composer:"ショパン", era:"ロマン派", year:"1834年", opus:"Op.66（遺作）", key:"嬰ハ短調・2/2拍子", form:"即興曲／複合三部形式（ピアノ独奏）", mood:["華やか","切ない"],
 summary:"右手の16分音符と左手の三連符がぶつかる両端部と、中間部の甘い旋律の対比。ショパン自身は生前に出版しなかった。",
 diff:"ヘンレ難易度 7（小売サイト経由の情報で、ヘンレ公式での確認は未了）。ABRSMグレードは未確認。",
 story:"1834年にショパンが作曲したとされる。同じ年にはOp.17のマズルカやOp.18のワルツも生まれたが、本作だけは生前に出版されなかった。理由は不明で、ベートーヴェンの「月光」ソナタに似すぎているのを気にしたという説、同じ1834年に出たモシェレスの即興曲との類似を気にしたという説がある。ショパンは遺言で未発表作品の公表を禁じたとされるが、友人のフォンタナが1855年に遺作として世に出した。1960年ごろ、ルービンシュタインがパリの競売で「エステ男爵夫人のアルバム」を入手し、1835年の日付が入ったショパン自筆の清書譜を見つけた。表紙には「エステ男爵夫人のために作曲」とあり、フォンタナ版とは音やニュアンスの違いが多い。ルービンシュタインはこれを決定稿と考えた。ただし日本語版Wikipediaは発見を1962年としており、年に食い違いがある。",
 pub:"1855年、ユリアン・フォンタナが遺作として出版（Op.69・70のワルツと同時）。初演は未確認。自筆清書譜（1835年付）を基にした版は、ウィーン原典版、ポーランド国民版、ペータース版、ヘンレ版などに収められている。録音は、フォンタナ版の例にバックハウス（1908年）、自筆譜版の例にルービンシュタイン（1964年）が挙げられる（日本語版Wikipedia）。",
 ded:"公式な献呈者は未確認。1835年の自筆清書譜の表紙に、フランス語で「エステ男爵夫人のために作曲」とある。ルービンシュタインは、有償の委嘱作だった可能性を推測している。日本語版Wikipediaは「エステ公爵夫人（ショパンの弟子）への献呈」と記し、英語版の「男爵夫人」と表記が異なる。",
 nameOrigin:"「幻想即興曲」の題はショパンの生前にはなく、フォンタナが1855年に出版したときに付けた。即興曲としては最初に書かれたが出版が最後になったため、第4番という番号になった。この番号は旧全集の便宜上のもの。",
 structure:[
  ["A部（Allegro agitato、嬰ハ短調、2/2）","右手の16分音符と左手の三連符が絶えず絡み合い、休みなく動く。「月光」ソナタ第3楽章との類似がオスターのシェンカー分析で指摘されている。"],
  ["B部（Largo → Moderato cantabile、変ニ長調）","嬰ハ長調と異名同音の変ニ長調に移り、のびやかな歌になる。この旋律は1917年のポピュラー曲『I'm Always Chasing Rainbows』に引用された。"],
  ["A'部（Presto、嬰ハ短調へ復帰）","冒頭の急速な動きが戻る。"],
  ["コーダ","左手がB部の主題を静かに弾き直し、右手は16分音符を続ける。最後は嬰ハ長調の和音（ピカルディ終止）で静かに閉じる。"]],
 features:"複合三部形式（A-B-A'）。2/2拍子の中で、右手の16分音符と左手の三連符が交差リズムを作り、緊迫感を支える。中間部は同主調の異名同音（変ニ長調）に移り、急から緩へ性格を一変させる。オスターの分析では、同じ嬰ハ短調の「月光」ソナタとの類縁が強い。主題提示の2小節後の急速なパッセージは、「月光」終楽章のカデンツァと同じ音を1オクターヴ上で用いる。一方、ハネカーは一部を「感傷的」で「気高さに欠ける」と批判している。",
 perf:"右手の16分音符と左手の三連符のずれを、拍が崩れずに保つことが最大の課題。ノンストップの急速なパッセージを滑らかなレガートで弾き通す持久力が要る。中間部は旋律を歌わせつつ伴奏の流れを保つ。版によって音が異なるため、フォンタナ版と自筆譜版のどちらを使うかを決めておく。",
 recs:[

{
 id:"nocturne-9-2", title:"ノクターン第2番", en:"Nocturne in E-flat major, Op.9 No.2",
 composer:"ショパン", era:"ロマン派", year:"1830〜31年頃", opus:"Op.9-2", key:"変ホ長調・12/8拍子", form:"夜想曲（ピアノ独奏）", mood:["夜","穏やか"],
 summary:"揺れる左手の伴奏の上で、同じ旋律が回帰するたびに装飾を増していく夜想曲。ショパンの夜想曲の中でも特に広く親しまれている。",
 diff:"ヘンレ版（夜想曲集 HN 233）での難易度は 6（medium）。ABRSMグレードは未確認。",
 story:"ショパンはポーランドの動乱の中で1831年にパリへ移り、そのまま帰国できなくなった。作品9の三曲の夜想曲は1830〜31年頃に書かれ（IMSLPは1830-31年）、ショパンにとって初めて出版された夜想曲集である。夜想曲というジャンルはアイルランド出身のジョン・フィールドが築いたもので、アルペジオの伴奏に歌うような旋律を載せる型を持つ。サロン向けの作品が求められた若い作曲家にとって、格好の形式だった。本曲もフィールドの影響が強いとされるが、旋律が回帰するたびに装飾が増す点には、イタリア・オペラの装飾的な歌唱からの影響が指摘される。ショパンは再現のたびに自由に変奏して弾いたと伝えられ、弟子の楽譜にも装飾の書き込み例が残る。なお、具体的な作曲日や直接のきっかけを伝える一次資料は確認できなかった。",
 pub:"1832年にパリ等で出版。ただしモーガン図書館の書誌ではパリのシュレジンジャー版とライプツィヒのキストナー版を「1832?」と疑問符付きで記し、初版を1833年とする記述もあり、出版年は資料間で揺れがある。初演は未確認。",
 ded:"マリー・プレイエル（ピアノ製作会社プレイエル社のカミーユ・プレイエルの妻で、ベルリオーズの元婚約者）。",

 perf:"ポイントは、(1)左手を均一に保ちつつペダルで響きをつなぐ、(2)右手の装飾音を拍の中に自然に収めるルバート、(3)再現ごとに装飾を増やしながら歌の流れを切らないこと、(4)senza tempoの小節の処理。ショパン自身が変奏を加えて弾いたとされるため、版や弟子の書き込み例を参照する演奏者も多い。",

 composer:"ショパン", era:"ロマン派", year:"1838〜39年", opus:"Op.28-15", key:"変ニ長調・4/4拍子", form:"前奏曲（ピアノ独奏）／三部形式", mood:["雨","夜"],
 summary:"曲全体で鳴り続ける同じ音が、雨だれを思わせる。穏やかな主題と、暗く迫る中間部の対比。24曲の前奏曲で最長。",

 story:"作品28の24の前奏曲は、1839年1月にマジョルカ島で完成したことが、友人フォンタナ宛ての手紙から確認できる。着手の時期は明らかでなく、1831年から1838年までの諸説がある。ショパンは1838年11月から翌年2月まで、ジョルジュ・サンドとともに島に滞在し、雨の多い湿った冬と体調不良に苦しんだ。ヘンレ版の解説によれば、第15番は、サンドの回想では島の嵐の中で書かれたとされるが、最初のスケッチはすでにパリで作られていたことを示す資料もある。サンドの回想録は、雨の夜にショパンが、自分が湖で溺れ、冷たい水滴が胸に規則的に落ちる夢を見たと記す一方、ショパンは雨音を模倣したと解釈されることに強く反発した、とも伝える。つまり「島で雨音を聞いて書いた」という通説は、史実としては裏付けが弱い。曲集は1839年9月に出版された。",
 pub:"作品28全体は1839年9月に出版。第15番単独の初演の日時・演奏者は未確認。ショパン自身が演奏会で取り上げたのは24曲中4曲までと伝えられる。",
 ded:"作品28全体は、フランス版がカミーユ・プレイエル、ドイツ版がヨゼフ・クリストフ・ケスラーに献呈。第15番に固有の献呈は確認できない。",
 nameOrigin:"「雨だれ」はショパン自身の命名ではない。命名者と時期は確認できなかった。【史実】1838〜39年の冬にショパンとサンドがマジョルカ島に滞在したこと。作品28の完成が1839年1月のマジョルカであること。サンドが回想録で、雨の夜にショパンが水滴の夢を見て、雨音の模倣だとする解釈に抗議したと書いていること。【伝承・推測】この逸話に出てくる曲を、サンドは曲名で特定していない。多くの評論家が、繰り返される変イ音（嬰ト音）の響きから第15番だと推測してきたにすぎない。ピーター・ダヤンは、サンドもショパンの抗議を受け入れ、この曲を雨音の模倣ではなく自然の響きの音楽的な翻訳と見ていたと指摘している。",
 structure:[
  ["A（変ニ長調、Sostenuto、4/4）","穏やかで晴朗な主題。変イ音の連打が曲全体を通して鳴り続け、雨だれに聴こえる要因となる。"],
  ["B（嬰ハ短調）","異名同音で嬰ハ短調に移り、陰鬱で重い中間部へ。属音のペダルが途切れず低音で続く（バッソ・オスティナート）。変イ音は嬰ト音として、より執拗になる。"],
  ["A'（変ニ長調への回帰）","冒頭の主題に戻る。ニークスは、中間部の悪夢から覚めた後の清明な自然のようだと評した。"]],
 features:"曲全体の核は、右手内側または低音域で刻まれ続ける変イ音（中間部では異名同音の嬰ト音）。変ニ長調の明るさと嬰ハ短調の暗さが異名同音を介して対比され、同じ反復音が文脈によって意味を変える。24曲中で最も長く、演奏時間は約5〜7分。中間部では属音の持続音が低音に固定され、音が積み重なって緊迫感を強める。長調から短調への移行は、両調が異名同音で結ばれていることを活かした大胆な場面転換である。",
 perf:"技術的な難所は少ないが、(1)終始鳴る反復音を、一定の脈動を保ちつつ機械的にならない音量とタッチで弾き分けること、(2)中間部で反復音が大きくなる際に、旋律線を見失わないこと、(3)長調部と短調部の性格の切り替え、(4)ペダルによる響きの濁りのコントロール、が主なポイント。演奏時間が長めなので、全体の設計が重要になる。",

 diff:"ヘンレ版の難易度は 5（medium）。同じ組曲の前奏曲は7、メヌエットとパスピエは6。ABRSMグレードは未確認。",
 story:"ドビュッシーは1890年ごろ、20代後半でピアノ組曲を構想し、前奏曲・メヌエット・「感傷的な散歩」・パヴァーヌを並べた。のちに「感傷的な散歩」は「月の光」に、パヴァーヌは「パスピエ」に改題された。どれもヴェルレーヌの詩に由来する題名である。組曲名の「ベルガマスク」は、詩集『艶なる宴』の詩「月の光」の冒頭にある「仮面とベルガモの踊り手」の語から取られた。ドビュッシーはこの同じ詩に歌曲も付けているが、組曲の「月の光」はそれとは全く別の音楽である。ヘンレ版の解説によると、原稿は1890年に出版社ショードンへ渡ったまま刊行されず、1905年にフロモン社から出た。ドビュッシーは校正刷に作曲年「1890」と書き入れ、初期作であることを明示した。出版前に改訂したことは確かだが、1890年の形と1905年の形で何がどれだけ違うのかは、現存資料からは分かっていない。",

 story:"作曲の年も事情も記録がなく、1680年ごろから1706年までさまざまな説がある。シュルツェは、1694年に行われたJ.S.バッハの兄ヨハン・クリストフの結婚式のために書かれたと推測したが、パッヘルベル研究者のウェルターはこれを憶測と退けている。ビーバーの曲集（1696年刊）への応答とする説もある。原曲は3本のヴァイオリンと通奏低音のための作品で、ジーグと対で伝わる。現存最古の写本は1838〜42年頃のもので、カノンだけが1919年にベックマンにより出版された。広く知られるようになったのは、1968年のパイヤール室内管弦楽団による録音（パイヤール自身の補筆つき編曲）以降である。",

 structure:[["カノン","同じ旋律を2小節ずらして3つのヴァイオリンが追う。低音は8つの和音（D-A-Bm-F#m-G-D-G-A）を繰り返す。"],["変奏","低音の28回の反復の上で、4分音符、8分音符、16分音符と音価が細かくなり、付点やシンコペーションも現れる。"],["ジーグ","12/8拍子、各10小節の2部分。カノンと違い固定低音はなく、模倣的な書法で進む。"]],
 features:"ほぼ同じ低音進行を繰り返し、その上に3声が同じ旋律を時間差で重ねる。厳格な模倣であるカノンと、低音が固定された変奏曲（シャコンヌ的）の二つの形式が一曲に重なる点が特色。和声進行はロマネスカ型とされ、のちのポップスにも多く転用された。上声が少しずつ細かく動いて曲が盛り上がるので、同じ和音の繰り返しでも飽きずに聴ける。",
 perf:"低音の4分音符を一定に保ち、上声の音価が細かくなっても速さを変えないことが大切。声部の入りは均等に、先に入った声部を邪魔せず歌い継ぐ。ピアノ編曲では各声部の受け渡しを聴き分けて弾く。",

 story:"1825年、シューベルトはウォルター・スコットの叙事詩『湖上の美人』のドイツ語訳から7曲を作曲し、その第6曲がこの歌である。作品52として1826年に出版された。ヒロインのエレンが聖母に庇護を祈る場面の歌で、各連の始めと終わりに現れる「Ave Maria」という呼びかけが通称の由来になった。のちにこの旋律へラテン語の祈祷文を当てて歌う習慣が広まったが、シューベルトが典礼文に曲を付けたわけではない。ピアノ独奏版はリストが1837〜38年に作った『シューベルトの12の歌曲』S.558の第12曲（1876年改訂）で、旋律を中音域に置き、上下の和音で包み込む。",
 pub:"原曲は1826年出版（作品52）。リスト編曲は『12 Lieder von Franz Schubert』S.558に収録（1838年刊とする資料あり）。",
 ded:"原曲は、初演先のゾフィー・ヴァイセンヴォルフ伯爵夫人に献呈されたと伝わる。リスト編曲の献呈は未確認。",
 nameOrigin:"歌詞冒頭と各連末の呼びかけ「Ave Maria」から。『湖上の美人』ゆえ、初演先の伯爵夫人自身も「湖上の美人」と呼ばれたとされる。",
 structure:[["第1連","穏やかな分散和音に乗り、祈りの旋律が始まる。"],["第2〜3連","同じ旋律を保ちつつ、詩の内容に応じて表情が変わる。"],["リスト版の中間部","和音の伴奏が分散和音に替わり、高音域で静かに輝く。"],["リスト版の頂点と結び","感情が最も高まったのち、再び静けさに戻る。"]],
 features:"原曲は変ロ長調で、持続低音と六連符の伴奏に息の長い旋律が乗る簡素な歌。リストの独奏版は原曲の構成にほぼ忠実で、旋律を中音域に置き、上下の音域を和音や分散和音で囲むため、三本の手で弾くような響きになる。派手な技巧曲ではないが、多層の音色と分散和音の処理に、高度な技術と音楽性が求められる。",
 perf:"旋律を中音域でレガート・カンタービレに歌わせ、伴奏の分散和音は音量を抑えて旋律の下に溶かす。ペダルは濁らないよう細かく踏み替え、頂点でも音を割らず、結びは息を整えて静かに閉じる。",

 films:[["ファンタジア","1940","「禿山の一夜」に続く終結部。ストコフスキー編曲の声楽・弦楽版（ピアノ版ではない）。","https://en.wikipedia.org/wiki/Ave_Maria_(Schubert)"]],

{"cat": "ピアノ独奏", "id": "prelude-bwv846", "title": "平均律クラヴィーア曲集第1巻 第1番 前奏曲 ハ長調", "en": "Prelude in C major, BWV 846 (The Well-Tempered Clavier, Book 1)", "composer": "ヨハン・ゼバスティアン・バッハ", "era": "バロック", "year": "1722", "opus": "BWV 846", "key": "ハ長調 4/4", "form": "前奏曲(分散和音型。フーガと対で一組)", "mood": ["穏やか"], "summary": "分散和音だけで織られた、平均律第1巻の幕開けの前奏曲。グノーのアヴェ・マリアの土台としても知られる、静かで澄んだ名曲。", "diff": "未確認(「比較的取り組みやすい」とする日本語の楽譜解説はあるが、ヘンレ等の等級は確認できず)", "story": "この前奏曲は、バッハが1722年にまとめた『平均律クラヴィーア曲集』第1巻の冒頭を飾る曲です。全24の調を使って前奏曲とフーガの組を並べるという構想の最初の一歩にあたり、鍵盤楽器で全調が弾けるように調律された状態を前提にしています。曲は全35小節で、ほとんどが分散和音だけで組み立てられており、旋律らしい旋律はなく、和声の移ろいそのものが音楽になっています。この簡素さが、調性の世界へ入っていく導入にふさわしいと受け取られてきました。なお、制作の細かな経緯や自筆譜に関する詳細までは今回の調査では確認できていません。", "pub": "生前の出版は未確認(第1巻は1722年の編纂として知られる)", "ded": "未確認", "nameOrigin": "「平均律」は曲集全体の題名で、全24の調による前奏曲とフーガを収めることに由来する。", "structure": [["冒頭(1小節〜)", "ハ長調の主和音を分散和音で示して始まる。"], ["中間部", "和音の連なりで転調を重ね、緊張感を高めていく。"], ["終結部", "主音の保続音の上で和音が静かに収束する。"]], "features": "ほぼ全体が分散和音の同じ形の繰り返しで、旋律線が目立たない。そのぶん和声の色合いの変化がはっきり聞こえる。全35小節と短く、鍵盤楽器の入門から鑑賞まで幅広く親しまれている。", "perf": "音を均等に保ちつつ、和声が変わる箇所で響きの色を少し変えると流れが生きる。ペダルの使い方で響きの濁りを避けつつ、息づかいを感じさせたい。", "recs": [], "films": [], "cms": [], "textbooks": [], "related": ["グノー「アヴェ・マリア」(1853年に『バッハの第1前奏曲による瞑想曲』として出版。バッハの前奏曲の和声進行にほぼそのまま旋律を重ねた作品。声楽版は1859年)", "平均律クラヴィーア曲集 第1番 フーガ ハ長調"], "imslp": "https://imslp.org/wiki/Special:Search?search=Prelude+in+C+major,+BWV+846", "trivia": ["グノーはバッハの前奏曲をほとんど変えずに伴奏として使い、その上に旋律を重ねた。", "グノー作品は最初ヴァイオリン独奏の旋律で出版され、のちにラテン語詞が付いて広まった。", "前奏曲は全35小節という短さである。"], "sources": ["https://en.wikipedia.org/wiki/Prelude_and_Fugue_in_C_major,_BWV_846", "https://en.wikipedia.org/wiki/Ave_Maria_(Bach/Gounod)"]},
{"cat": "ピアノ独奏", "id": "pavane", "title": "亡き王女のためのパヴァーヌ（ピアノ原曲）", "en": "Pavane pour une infante défunte (Pavane for a Dead Princess)", "composer": "モーリス・ラヴェル", "era": "近代（印象派）", "year": "1899", "opus": "M. 19", "key": "ト長調（拍子は未確認）", "form": "パヴァーヌ（緩やかな舞曲に基づく）", "mood": ["切ない", "穏やか"], "summary": "古い舞曲の趣と静かな哀感を湛えた、ラヴェル初期の代表的ピアノ小品。", "diff": "未確認", "story": "1899年、ラヴェルがパリ音楽院でフォーレに学んでいた時期に書かれたピアノ独奏曲。パトロンのポリニャック大公妃に献呈され、出版は1900年にウジェーヌ・ドゥメが手がけた。当初はあまり注目されなかったが、1902年4月5日にリカルド・ビニェスが初演すると、次第に人気を集めた。ラヴェル自身は後年、シャブリエの影響が明白で形式も貧しいと冷静に批評している。1910年には自ら管弦楽に編曲し、1911年2月にマンチェスターでヘンリー・ウッドの指揮により初演された。", "pub": "1900年、ウジェーヌ・ドゥメ社", "ded": "ポリニャック大公妃（Princesse de Polignac）", "nameOrigin": "ラヴェルは、昔のスペイン宮廷で幼い王女が踊ったかもしれないパヴァーヌの情景だと説明した。一方で、題は語の響きが気に入って付けただけだとも語っている。特定の王女の追悼ではない。", "structure": [["全体像", "楽章・部分ごとの詳細な構成は出典で確認できなかった（未確認）。"]], "features": "古風でほぼ素朴な和声と、抑えた表情、どこか遠い旋律の美しさが特徴。演奏時間は約6〜7分で、後に管弦楽版も書かれ、ホルンが主旋律を担う。", "perf": "ラヴェルは非常に遅いテンポを想定していたとされるが、重く引きずる演奏は好まなかった。「死んだパヴァーヌ」ではなく「死んだ王女のためのパヴァーヌ」だと本人が語った逸話があり、舞曲の歩みを保つ意識が要る。", "recs": [["ラヴェル本人（ピアノロール）", "1922", "自作自演のピアノロール録音（英語版Wikipedia）。"]], "films": [], "cms": [], "textbooks": [], "related": ["管弦楽版（1910）", "鏡", "クープランの墓", "フォーレ「パヴァーヌ」"], "imslp": "https://imslp.org/wiki/Pavane_pour_une_infante_d%C3%A9funte_(Ravel,_Maurice)", "trivia": ["ラヴェル自身は、初演者の演奏を評した批評で、この曲の欠点を率直に述べた。", "1910年の管弦楽版では、2本の「単純なホルン（ナチュラルホルン）」を指定している。", "1932年の録音は長く本人指揮とされたが、実際はペドロ・デ・フレイタス・ブランコの指揮だった。"], "sources": ["https://en.wikipedia.org/wiki/Pavane_pour_une_infante_d%C3%A9funte"]},
{"cat": "ピアノ独奏", "id": "nocturne-20", "title": "ノクターン第20番 嬰ハ短調 遺作(レント・コン・グラン・エスプレッシオーネ)", "en": "Nocturne No. 20 in C-sharp minor, Op. posth. (Lento con gran espressione)", "composer": "フレデリック・ショパン", "era": "ロマン派", "year": "1830", "opus": "遺作(B.49 / KK IVa-16 / WN 37)", "key": "嬰ハ短調・4/4拍子", "form": "三部形式(A-B-A')の夜想曲", "mood": ["切ない", "夜"], "summary": "ウィーン到着直後の1830年、姉のために書かれたノクターン。協奏曲の断片を引用した回想的な小品で、映画『戦場のピアニスト』の冒頭でも流れる。", "diff": "未確認", "story": "1830年、ショパンが故郷ワルシャワを離れてウィーンに着いた直後に書いた作品。姉ルドヴィカに送られ、「第2協奏曲に取り組む前の練習に」という趣旨の献辞が添えられたと伝わる。実際、中間部にはピアノ協奏曲第2番の終楽章の主題や第1楽章の第2主題の断片、さらに歌曲「乙女の願い」の旋律が織り込まれ、姉の愛した曲への思い出の引用になっている。ポーランドで十一月蜂起が起きた時期と重なるため、望郷の念の表れと見る向きもあるが、曲の軽やかさから蜂起の報を知る前の作とする見方もあり、決着していない。ルドヴィカは「夜想曲風のレント」として整理しており、後にノクターンとして扱われるようになった。", "pub": "作曲者の死後の1875年に出版。伝記作家シュルツが手稿を見つけ、ライトゲーベルが出版した。初版の題は「アダージョ」。", "ded": "姉ルドヴィカのために書かれた(手稿に添えられた献辞)。公式な献呈の形での出版献辞は未確認。", "nameOrigin": "ショパン自身は『ノクターン』とも番号とも付けていない。遺作として刊行された初版の題は『アダージョ』で、姉ルドヴィカの整理(夜想曲風のレント)を通じてノクターンとして定着し、通称の『レント・コン・グラン・エスプレッシオーネ』は楽譜の速度標語に由来。『追憶(Reminiscence)』の別名は望郷の曲とする解釈に基づく。生前出版のノクターンは18曲で、本作は含まれず『第20番』は後世の通し番号。", "structure": [["序奏(1〜4小節)", "静かな導入のあと、5小節目から主要旋律が始まる。"], ["主部A", "左手の流れるアルペジオの上で、息の長い歌が展開する。"], ["中間部B", "協奏曲第2番(第3楽章の主題・第1楽章の第2主題)と歌曲「乙女の願い」の断片を引用。"], ["再現A'", "冒頭の主題が戻り、最後は嬰ハ長調の和音で静かに閉じる。"]], "features": "哀愁をおびた旋律がゆったりした左手のアルペジオに乗って歌われ、ショパンの初期ノクターンの特徴をよく示す。後半では協奏曲や歌曲からの引用が次々に現れ、郷愁を帯びた回想のような趣を生む。最後は短調の曲でありながら長調の和音で結ばれ、悲しみの中にかすかな救いが残る。技巧的には、中間部の細かな装飾音形がやや目立つ程度で、全体として演奏のしやすさと表現の深さを両立している。", "perf": "主旋律を歌わせるには、左手のアルペジオを小さな音量で保つことが肝心。中間部は引用が連なるので、各断片の表情を弾き分けつつも流れを止めない。テンポを揺らしすぎず、最後の和音を静かに響かせる。", "recs": [], "films": [["戦場のピアニスト", "2002", "冒頭のワルシャワのラジオ局の場面と、戦後にラジオへ復帰する場面で使われたとIMDbのFAQにある。ドイツ軍将校ホーゼンフェルトの前で弾くのは本曲ではなくバラード第1番。", "https://en.wikipedia.org/wiki/The_Pianist_(2002_film)"]], "cms": [], "textbooks": [], "related": ["ピアノ協奏曲第2番 ヘ短調 Op.21", "歌曲「乙女の願い」Op.74-1", "ノクターン第1番 変ロ短調 Op.9-1", "バラード第1番 ト短調 Op.23(映画でホーゼンフェルトの前で演奏される曲)"], "imslp": "https://imslp.org/wiki/Nocturne_in_C-sharp_minor,_B.49_(Chopin,_Fr%C3%A9d%C3%A9ric)", "trivia": ["実在のピアニスト、シュピルマンは1939年9月23日のポーランド放送で本曲を弾いている最中に、空襲で放送が中断されたと伝えられる（Wikipedia）。", "1894年10月17日、ジェラゾヴァ・ヴォラでのショパン記念碑除幕を祝って、バラキレフが演奏したとされる。", "手稿はスペイン・バルデモサのカルトゥハ修道院に所蔵されている。"], "sources": ["https://en.wikipedia.org/wiki/Lento_con_gran_espressione", "https://en.wikipedia.org/wiki/The_Pianist_(2002_film)", "https://m.imdb.com/title/tt0253474/faq", "https://s10.imslp.org/wiki/Nocturne_in_C-sharp_minor,_B.49_(Chopin,_Fr%C3%A9d%C3%A9ric)"]},
{"cat": "ピアノ独奏", "id": "pathetique-2", "title": "ピアノソナタ第8番「悲愴」 第2楽章", "en": "Piano Sonata No. 8 in C minor, Op. 13 \"Pathétique\" II. Adagio cantabile", "composer": "ルートヴィヒ・ヴァン・ベートーヴェン", "era": "古典派", "year": "1798(出版は1799)", "opus": "Op. 13", "key": "変イ長調(未確認の細部は省略)", "form": "アダージョ・カンタービレ(緩徐楽章)", "mood": ["穏やか", "切ない"], "summary": "激しい両端楽章の間で、歌うような旋律が静かに広がる緩徐楽章。ベートーヴェンの優しさが最も親しまれた形で表れる一曲。", "diff": "未確認", "story": "ピアノソナタ第8番ハ短調は、ベートーヴェンが27歳だった1798年に書かれ、1799年に出版されました。「悲愴」という題は、出版社がこの曲の悲劇的な響きに感銘を受けて付けたもので、作曲者自身の命名と思われがちですが、題名を気に入ったのはベートーヴェンだったと説明されています。作品はリヒノフスキー侯爵に献呈されました。第2楽章は「アダージョ・カンタービレ」で、歌うような旋律が最も有名な部分です。映画や広告、ゲームなどでも使われ、大衆文化にも広く浸透しているとされます。ただし個別の使用例の出典は今回確認できていません。", "pub": "1799年", "ded": "カール・フォン・リヒノフスキー侯爵", "nameOrigin": "出版社が命名した「グランド・ソナタ・パテティーク」に由来。作曲者も気に入ったとされる。", "structure": [["主部A", "歌うような主旋律が静かに現れる。"], ["中間部", "やや動きのある部分で気分を変える。"], ["主部の回帰", "旋律が戻り、穏やかに結ばれる。"]], "features": "歌うような旋律が全体を貫く、ソナタ中で最も親しまれている緩徐楽章。激しい両端楽章とは対照的に、安らぎと温かさを湛えている。", "perf": "旋律を長く保って歌わせ、内声の伴奏を出しすぎないようにする。ペダルで音を濁らせず、息の長いフレーズを保つことが肝心。", "recs": [], "films": [], "cms": [], "textbooks": [], "related": ["ピアノソナタ第14番「月光」", "ピアノソナタ第23番「熱情」"], "imslp": "https://imslp.org/wiki/Special:Search?search=Piano+Sonata+No.+8+in+C+minor,+Op.+13+\"Pathétique\"+II.+Adagio+cantabile", "trivia": ["題名は出版社が付けたが、ベートーヴェンの好みに合ったとされる。", "作曲時、ベートーヴェンは27歳だった。", "献呈先はリヒノフスキー侯爵。"], "sources": ["https://sin80.com/en/work/beethoven-piano-sonata-8-pathetique-op13", "https://www.classicals.de/beethoven-piano-sonata-no8"]},
{"cat": "ピアノ独奏", "id": "k331-1", "title": "ピアノ・ソナタ第11番 イ長調 K.331 第1楽章（主題と6つの変奏）", "en": "Piano Sonata No. 11 in A major, K. 331 (300i), I. Andante grazioso (Theme and Variations)", "composer": "ヴォルフガング・アマデウス・モーツァルト", "era": "古典派", "year": "1783年頃（1784年出版）", "opus": "K.331 / 300i", "key": "イ長調 6/8", "form": "主題と6つの変奏（主題はシチリアーナ風）", "mood": ["穏やか", "華やか"], "summary": "ソナタの幕開けに変奏曲を置いたモーツァルトの異色作。ゆれるシチリアーナ風の主題が6通りに姿を変え、第3楽章のトルコ行進曲へ続く。", "diff": "未確認", "story": "長らく1778年のパリ滞在中の作とされてきたが、近年の研究で1783年ごろのウィーン時代の作と見られている。1784年にウィーンのアルタリア社から、第10番K.330・第12番K.332とともに出版された。ソナタ形式の楽章を持たず、冒頭に変奏曲、次にメヌエット、最後にトルコ風のロンドを置く異例の並びで、全楽章がイ長調かイ短調で統一されている。2014年にはブダペストの国立セーチェーニ図書館で第1・第2楽章部分にあたる自筆譜4ページが見つかり、同年コチシュが初演奏した。1783年はウィーンがトルコ軍の包囲を退けて100年の節目にあたり、終楽章のトルコ趣味にはその世相が映るとする見方もある。", "pub": "1784年、アルタリア社（ウィーン）。K.330、K.332と同時出版", "ded": "未確認", "nameOrigin": "通称「トルコ行進曲付き」は第3楽章にモーツァルト自身が付けた「Alla turca（トルコ風に）」の指示に由来する。トルコ軍楽隊（イェニチェリ）の響きを模したもので、第1楽章自体に愛称はない。", "structure": [["主題（Andante grazioso）", "8小節＋10小節それぞれにリピートが付く2部構成。この枠組みが全変奏で保たれる。"], ["第1・第2変奏", "上声の装飾、続いて3連16分音符の伴奏上での旋律装飾。"], ["第3変奏", "イ短調に転じ、音階的な装飾が続く。第3楽章の動機との近さも指摘される。"], ["第4・第5変奏", "第4は手の交差を伴う華やかな変奏。第5は初めてAdagioに落とし、細かな装飾を加える。"], ["第6変奏", "4/4拍子のAllegroに変わり、終結部の役割を果たす。"]], "features": "ソナタの冒頭楽章に変奏曲を置いたため、典型的な急速なソナタ形式の幕開けを避けた作品となった。主題はゆれるシチリアーナ風の6/8で、変奏が進んでも8小節＋10小節の形は変わらず、短調への転換、手の交差、遅いテンポの変奏、速い終結変奏と、表情だけが次々に変わる。第3楽章のトルコ行進曲の人気に隠れがちだが、全体の入口として穏やかな性格を担う。", "perf": "主題はなだらかな拍の揺れを保ち、装飾音は旋律の流れを壊さないよう軽く。第3変奏の短調は音色を変えて陰影をつけ、第5変奏のAdagioは歌い込み、第6変奏で一気にテンポを上げるテンポ対比を明確にする。繰り返しでは装飾を加えるかどうかも考えどころ。", "recs": [], "films": [], "cms": [], "textbooks": [], "related": ["ピアノ・ソナタ第11番 第3楽章（トルコ行進曲）", "ピアノ・ソナタ第10番 K.330", "ピアノ・ソナタ第12番 K.332", "レーガー《モーツァルトの主題による変奏曲とフーガ》", "ベートーヴェン ピアノ・ソナタ第12番 Op.26（変奏曲で始まる点の先例とされる）"], "imslp": "https://imslp.org/wiki/Piano_Sonata_No.11_in_A_major,_K.331/300i_(Mozart,_Wolfgang_Amadeus)", "trivia": ["第1楽章の主題は、マックス・レーガーが1914年の管弦楽曲《モーツァルトの主題による変奏曲とフーガ》に用いた。", "ブルーベックの《ブルー・ロンド・ア・ラ・トルク》(1959)は、この終楽章を元にした曲ではないとされる。", "第5変奏の最後の3音のリズムは、自筆譜と一般の版で異なる箇所がある。"], "sources": ["https://en.wikipedia.org/wiki/Piano_Sonata_No._11_(Mozart)", "https://enc.piano.or.jp/en/musics/296", "https://imslp.org/wiki/Piano_Sonata_No.11_in_A_major,_K.331/300i_(Mozart,_Wolfgang_Amadeus)"]},
{"cat": "ピアノ独奏", "id": "prelude-7", "title": "前奏曲第7番 イ長調 Op.28-7", "en": "Prelude No. 7 in A major, Op. 28 No. 7", "composer": "フレデリック・ショパン", "era": "ロマン派", "year": "1835〜1839(24曲全体の作曲期間)", "opus": "Op.28-7", "key": "イ長調・3/4拍子(Andantino)", "form": "自由な小品(前奏曲)。マズルカ風とされる", "mood": ["穏やか", "眠り"], "summary": "24の前奏曲の第7番。集中最短で、約45秒の素朴なマズルカ風の小品。短いが、穏やかな表情に満ちた愛らしい曲。", "diff": "未確認", "story": "前奏曲集Op.28は、1835年から1839年にかけて主にパリで書かれ、一部はジョルジュ・サンドらと過ごしたマヨルカ島バルデモサの冬(1838〜39年)に仕上げられた。大半の曲は渡島前にほぼできていたが、ショパンはプレイエルへの手紙で『ここで君の小さなピアノを使って前奏曲を完成させた』と記している。24曲は5度圏に沿って長調と平行短調を交互に並べる構成で、バッハの平均律集を意識したと言われる。第7番は集中最短で、演奏時間は約45秒。個々に標題は付けられていないが、マズルカのような趣があるとされる。本曲に関する個別の作曲日や逸話は確認できなかった。", "pub": "1839年に出版。フランス版(カトラン)と英国版(ウェッセル)、ドイツ版(ブライトコプフ&ヘルテル)で刊行された。", "ded": "フランス版・英国版はカミーユ・プレイエル、ドイツ版と手稿はヨーゼフ・クリストフ・ケスラーに献呈(曲集全体)。", "nameOrigin": "通称は未確認(ショパン自身は各曲に標題を付けていない)。日本では『イ長調の前奏曲』のように調で呼ばれることが多い。", "structure": [["全体像", "集中最短の小品で、約45秒。マズルカ風の性格を持つ。"], ["主題", "付点リズムを含む素朴で短い旋律が、穏やかな和声に乗って歌われる。"], ["後半", "主題の変化型が現れ、終わりへ向かって静かに収束する。"]], "features": "24の前奏曲の中でも特に短く、一息で終わる素朴な小品。楽譜の見た目もやさしく、和音の連なりが旋律を支える簡潔な書法で、ピアノ学習者にも親しまれる。形式的な展開はほとんどなく、一つの楽想がそのまま小さな世界を作る点にショパンの前奏曲らしさがある。他の作曲家も本曲を素材に使っている(モンポウ『ショパンの主題による変奏曲』など)。", "perf": "短いため、1音ごとの表情と和音の響きの選び方が全てを左右する。付点リズムは硬くならないよう軽く、マズルカらしい重心の置き方を意識する。弱音で終わりまで気を抜かないこと。", "recs": [], "films": [], "cms": [], "textbooks": [], "related": ["24の前奏曲 Op.28(全曲)", "前奏曲第15番 変ニ長調『雨だれ』", "フェデリコ・モンポウ『ショパンの主題による変奏曲』"], "imslp": "https://imslp.org/wiki/Preludes_Op.28_(Chopin,_Fr%C3%A9d%C3%A9ric)", "trivia": ["集中最短の第7番に対し、最長は第17番(90小節)。", "ショパンは生前、前奏曲を公開の場で4曲より多く弾くことはなかった。", "全曲の初録音は1915年のブゾーニ(ピアノロール)とされる。"], "sources": ["https://en.wikipedia.org/wiki/Preludes_(Chopin)", "https://imslp.org/wiki/Preludes_Op.28_(Chopin,_Fr%C3%A9d%C3%A9ric)"]},
{"cat": "ピアノ独奏", "id": "brahms-waltz-15", "title": "16のワルツ Op.39 第15番 変イ長調（ピアノ独奏版）", "en": "Waltz in A-flat major, Op. 39 No. 15 (solo piano version)", "composer": "ヨハネス・ブラームス", "era": "ロマン派", "year": "1865年作曲、1866年出版", "opus": "Op.39-15", "key": "変イ長調 3/4（独奏の簡易版はイ長調）", "form": "ワルツ。作品集の多くは反復を伴う2部形式", "mood": ["穏やか", "眠り"], "summary": "ブラームスの16のワルツの中でも最も愛される1曲。ゆるやかに揺れる旋律が、連弾から独奏に編まれて広く親しまれた。", "diff": "未確認（ヘンレ社は変イ長調の難しい版とイ長調の簡易版を別冊で出版）", "story": "《16のワルツ》Op.39は1865年に作曲され、翌1866年に出版された。もとはピアノ連弾用で、ブラームス自身が独奏用に難しい版と簡易版の2種を編んでおり、3つの版は同時に出版されて、作曲者の予想に反してよく売れた。当時ウィーンで流行していたワルツへの敬意を示すために書かれたとされ、批評家エドゥアルト・ハンスリックに献呈された。独奏の難しい版では最後の4曲などで調が連弾版から変えられており、第15番は連弾版ではイ長調、難しい独奏版では変イ長調になる。16曲のなかで最も人気が高い曲となった。", "pub": "1866年（連弾版・独奏難版・独奏簡易版が同時出版）", "ded": "エドゥアルト・ハンスリック", "nameOrigin": "曲名はないが、「ブラームスのワルツ」「ブラームスのワルツ第15番」として単独で親しまれる。", "structure": [["作品集の位置", "16曲の小さなワルツのうち第15番。連弾版はイ長調、難しい独奏版は変イ長調。"], ["版の違い", "ブラームス自身が独奏用に難しい版と易しい版の2つを編曲した。簡易版はイ長調。"], ["形式", "作品集の大半は、前半が属調などへ向かい、後半が展開風に始まって主題と主調へ戻る反復付き2部形式。"]], "features": "優しくゆれる旋律で知られる、16曲中で最も有名なワルツ。ウィーンの舞曲の流行を背景にした親しみやすい小品で、独奏版は難しい版と簡易版があるため、学習者から演奏者まで幅広く弾かれている。", "perf": "3拍子の1拍目に重心を置きすぎず、旋律を長いフレーズとして歌わせる。内声と左手の和音の厚みでやわらかな揺れを作り、テンポを動かしすぎないことが落ち着きにつながる。", "recs": [], "films": [], "cms": [], "textbooks": [], "related": ["ブラームス 16のワルツ Op.39（連弾版）", "ブラームス 愛の歌ワルツ Op.52", "ブラームス 6つの小品 Op.118"], "imslp": "https://imslp.org/wiki/16_Waltzes,_Op.39_(Brahms,_Johannes)", "trivia": ["作品集全体を一つの連作として真剣に扱うべきだと、1984年にピアニストのジョゼフ・スミスが評された。", "第15番を含む5曲（1, 2, 11, 14, 15番）は、作曲者の死後に2台ピアノ4手版が出版された。", "独奏の簡易版では第6番もハ長調に変えられている。"], "sources": ["https://en.wikipedia.org/wiki/Sixteen_Waltzes,_Op._39_(Brahms)", "https://www.henle.de/Waltzes-op.-39/HN-1638", "https://imslp.org/wiki/16_Waltzes,_Op.39_(Brahms,_Johannes)"]},
{"cat": "ピアノ独奏", "id": "mendelssohn-spring-song", "title": "無言歌集 第5巻 Op.62-6「春の歌」", "en": "Songs Without Words, Book 5, Op.62 No.6 \"Spring Song\" (Frühlingslied)", "composer": "フェリックス・メンデルスゾーン", "era": "ロマン派", "year": "第5巻の出版は1844年（作曲年は未確認）", "opus": "Op.62-6 / MWV U 161", "key": "イ長調、Allegretto grazioso（拍子は未確認）", "form": "性格的小品（無言歌）。詳細な楽式は未確認", "mood": ["穏やか", "華やか"], "summary": "歌詞のない歌をめざした無言歌集の中で最も親しまれる一曲。明るいイ長調の旋律に春のきざしを重ねた小品。", "diff": "未確認", "story": "無言歌集は1829〜45年に書かれた全8巻48曲のピアノ小品集で、第5巻Op.62は1844年に出版された。「春の歌」はその最終曲にあたる。英国ではロンドンのカンバーウェル・グリーンで書かれたとされ、「カンバーウェル・グリーン」の名でも呼ばれた。当時は妻の親戚であるベネッケ家に滞在していたと伝わる。第5巻の曲は作曲者自身が連弾にも編み、1844年にヴィクトリア女王へ贈られた。メンデルスゾーンは友人が無言歌に歌詞を付けようとした際、音楽は言葉より曖昧なのではなく、むしろ言葉より明確だと返している。歌詞なしでも歌のように語りかける、という無言歌の考えを軽やかな旋律で示した一曲である。", "pub": "第5巻Op.62として1844年に出版（無言歌集全体はOp.19〜Op.102の8巻）", "ded": "第5巻はクララ・シューマンに献呈（Wikipedia英語版が引くライナーノーツによる）", "nameOrigin": "「春の歌」は楽譜冒頭の発想標語（春の歌のように、の意）に由来すると日本語の解説にある。48曲中、作曲者自身の題と確認できるのは5曲のみで、他は出版社の付題か発想標語由来。英国での別名「カンバーウェル・グリーン」は作曲地とされる地名から。", "structure": [["曲集内の位置", "第5巻（Op.62）の第6曲で、巻の締めくくり"], ["調と速度", "イ長調、Allegretto grazioso"], ["演奏時間", "約2分半（PTNA）"], ["技巧上の焦点", "小音符で書かれた装飾的な音型を旋律にどう溶け込ませるかが課題とされる（PTNA）"]], "features": "歌詞のない器楽曲でありながら、歌い手に語らせるような抒情を目指した無言歌の代表作。明るいイ長調の旋律に、小音符の装飾的な動きが添えられ、春の軽やかさを思わせる。技巧は高度ではなく、アマチュアにも弾きやすいことが曲集全体の人気を支えた。ヴァイオリンやフルートなど他楽器への編曲も多く、日本では駅の発車メロディとしても使われている。", "perf": "小音符の音型を旋律から浮かせず、旋律の一部として滑らかに溶け込ませることが要点。繊細な技術と感覚が求められるとされる。伴奏は旋律の邪魔をしない軽さを保つとよい。", "recs": [], "films": [], "cms": [], "textbooks": [], "related": ["無言歌集 Op.62-3「葬送行進曲」", "無言歌集 Op.62-5「ヴェネツィアの舟歌」", "無言歌集 Op.67-4「紡ぎ歌」", "ファニー・メンデルスゾーンのピアノ小品"], "imslp": "https://imslp.org/wiki/Lieder_ohne_Worte,_Op.62_(Mendelssohn,_Felix)", "trivia": ["作曲者自身が題を付けたと確認できる無言歌は48曲中5曲のみ。", "無言歌という題は、姉ファニーの手紙から、メンデルスゾーン自身の発案らしいとされる。", "日本では各地の駅の発車メロディにも使われている。"], "sources": ["https://en.wikipedia.org/wiki/Songs_without_Words", "https://pedia.3rd-in.co.jp/wiki/%E7%84%A1%E8%A8%80%E6%AD%8C%E9%9B%86%20(%E3%83%A1%E3%83%B3%E3%83%87%E3%83%AB%E3%82%B9%E3%82%BE%E3%83%BC%E3%83%B3)", "https://enc.piano.or.jp/en/musics/23392"]},
{"cat": "ピアノ独奏", "id": "goldberg-aria", "title": "ゴルトベルク変奏曲 アリア", "en": "Goldberg Variations, BWV 988: Aria", "composer": "ヨハン・ゼバスティアン・バッハ", "era": "バロック", "year": "1741(出版)", "opus": "BWV 988", "key": "ト長調 3/4(未確認の細部は省略)", "form": "アリア(サラバンド風)。30の変奏の主題で、最後にダ・カーポで再現される", "mood": ["眠り", "穏やか"], "summary": "30の変奏の出発点となる、優美で静かなサラバンド風の主題。不眠の伯爵の逸話でも知られる、夜に寄り添う音楽。", "diff": "未確認", "story": "ゴルトベルク変奏曲は、1741年にクラヴィーア練習曲集の第4部として出版された、アリアと30の変奏からなる作品です。名前の由来として語られるのは、1802年にフォルケルが伝えた逸話で、ロシア大使カイザーリンク伯が不眠の夜を慰める曲を求め、若い鍵盤奏者ゴルトベルクが演奏した、というものです。ただし出版譜に伯やゴルトベルクへの献呈がなく、当時ゴルトベルクが14歳ほどだったことから、この話の真偽には疑問も出されています。冒頭のアリアは優美で穏やかなサラバンドで、変奏はこのアリアの低音の進行を土台に展開します。", "pub": "1741年、クラヴィーア練習曲集第4部として出版(2段鍵盤のチェンバロ用と表記)", "ded": "出版譜に献呈の記載はないとされる(未確認の点あり)", "nameOrigin": "1802年のフォルケルの伝記に基づく、ゴルトベルクが演奏したという逸話に由来するが、信憑性には疑問がある。", "structure": [["アリア", "サラバンド風の主題。装飾音の多い旋律を持つ。"], ["30の変奏", "アリアの低音の進行を土台に展開する。"], ["アリア・ダ・カーポ", "最後に冒頭のアリアが戻って閉じる。"]], "features": "優美で静かな舞曲風の主題で、装飾音に富んだ旋律線が特徴。変奏全体の出発点であり終着点でもあるため、全曲の枠を作る役割を持つ。聴く人を穏やかな気持ちにさせる落ち着いた曲想。", "perf": "装飾音を拍の流れに溶け込ませ、旋律を歌わせることが第一。繰り返しでの変化の付け方や、テンポの選び方で、印象が大きく変わる。", "recs": [["グレン・グールド", "1955年6月", "デビュー盤としての最初の録音。演奏時間38分34秒（Wikipedia）。"], ["グレン・グールド", "1981年4〜5月", "最後のスタジオ録音。演奏時間51分18秒。1983年グラミー賞（最優秀器楽ソロ）。"]], "films": [["羊たちの沈黙", "1991", "レクター博士が独房でアリアを聴く場面(その後の『ハンニバル』でも使用)", "https://www.opengoldbergvariations.org/discover/silence-of-the-lambs"]], "cms": [], "textbooks": [], "related": ["ゴルトベルク変奏曲 全曲", "クラヴィーア練習曲集"], "imslp": "https://imslp.org/wiki/Special:Search?search=Goldberg+Variations,+BWV+988:+Aria", "trivia": ["ゴルトベルクの名は1802年のフォルケルの伝記で結びつけられた。", "逸話では当時ゴルトベルクは14歳ほどで、話の真偽には疑問がある。", "『ハンニバル』(2001)ではタイトル曲としても使われた。"], "sources": ["https://www.qub.ac.uk/tomita/essay/cu4.html", "https://www.opengoldbergvariations.org/discover/silence-of-the-lambs", "https://pure.royalholloway.ac.uk/en/publications/dr-lecters-taste-for-goldberg-or-the-horror-of-bach-in-the-hannib"]},
{"cat": "ピアノ独奏", "id": "reverie", "title": "夢（Rêverie）", "en": "Rêverie", "composer": "クロード・ドビュッシー", "era": "近代（初期）", "year": "1890", "opus": "L. 68（L. 76 と表記する資料もある）", "key": "ヘ長調（拍子は未確認）", "form": "未確認", "mood": ["眠り", "穏やか"], "summary": "ドビュッシー本人は軽視したが、素朴な旋律美で広く愛されるようになった初期の小品。", "diff": "未確認", "story": "1890年に書かれた小品。ドビュッシー自身は1905年、フロモン夫人に宛てた手紙で、出版者ジョルジュ・アルトマンの頼みで急いで仕上げた取るに足らない曲で、出来も悪いと述べ、出版に反対した。それでも曲は人気を得て、ヴァイオリンとピアノ、連弾、チェロとピアノなど多くの編曲が出た。確認できる最初の公開演奏は1899年2月27日、ジェルメーヌ・アレクサンドルによるもの。作曲の動機や詳しい経緯は、今回確認できた資料では上記以上は分からなかった。", "pub": "1891年ショードン社、1895年11月16日『ル・イリュストラシオン』付録、1905年フロモン社", "ded": "未確認", "nameOrigin": "フランス語で「夢想」を意味する題名。命名の経緯は未確認。", "structure": [["全体像", "小規模な小品。楽式の詳細は出典で確認できなかった（未確認）。"]], "features": "ハリー・ハルブライヒは、素朴ながらも確かな旋律の魅力を持つ耳に心地よい曲と評した。単純な旋律美が中心の曲で、そのため多くの楽器へ編曲されている。", "perf": "素朴な旋律を飾らず歌わせる、という以外に出典で確認できた奏法上の指針はない（未確認）。", "recs": [], "films": [["ウエストワールド（第1シーズン）", "2016", "物語の中心的な役割を果たす（場面は未確認）", "https://en.wikipedia.org/wiki/R%C3%AAverie_(Debussy)"]], "cms": [], "textbooks": [], "related": ["アラベスク第1番", "月の光（ベルガマスク組曲）", "My Reverie（ラリー・クリントン）"], "imslp": "https://imslp.org/wiki/R%C3%AAverie_(Debussy,_Claude)", "trivia": ["ドビュッシー本人は後年この曲を評価しなかった。", "ラリー・クリントンの曲 My Reverie は、この旋律を転用している。", "1970年代後半、冨田勲のシンセサイザー版がフジテレビの放送開始・終了時に使われた。"], "sources": ["https://en.wikipedia.org/wiki/R%C3%AAverie_(Debussy)"]},
{"cat": "ピアノ独奏", "id": "gnossienne-1", "title": "グノシエンヌ 第1番", "en": "Gnossienne No. 1", "composer": "エリック・サティ", "era": "近代(19世紀末)", "year": "1890", "opus": "未確認", "key": "拍子記号・小節線なし(自由なリズム)。調性は未確認", "form": "3曲からなる「グノシエンヌ」の第1曲", "mood": ["夜", "切ない"], "summary": "拍子も小節線もない自由な時間の中で、物憂い旋律が揺れる。サティが神秘思想に近づいた時期の、夜に似合う一曲。", "diff": "未確認", "story": "グノシエンヌは1890年ごろに作曲され、1893年に出版された3曲の連作で、第1番は1890年の作とされます。当時のサティは、ジョゼファン・ペラダンを通じて薔薇十字の宗派と関わるなど、オカルトや神秘思想に近い環境にいました。楽譜には拍子記号も小節線もなく、自由な時間の流れの中で旋律が進みます。この記譜は、型にはまらない独特の雰囲気を生み、後の作品にも影響を与えたと語られます。第1番は1913年にロラン=マニュエルへ献呈されたとされます。ただし成立事情の細部については、今回の調査では確認できていません。", "pub": "1893年(3曲のグノシエンヌとして)", "ded": "アレクシス・ロラン=マニュエル(1913年)", "nameOrigin": "語源には諸説ある。テセウスがミノタウロス退治を祝って踊ったという迷宮の舞踏を指す語(1865年のラルース辞典)や、グノーシス(認識)に由来するとの説がある。", "structure": [["冒頭", "左手の伴奏型の上で、物憂げな旋律が現れる。"], ["中間部", "旋律の動きが少し変わり、自由な拍で進む。"], ["終結", "静かに音が消えるように閉じる。"]], "features": "拍子記号や小節線がない自由な時間感覚の曲。単純な伴奏型と、東方的とも評される旋律が組み合わさり、夢うつつのような雰囲気を作り出している。", "perf": "拍を数えすぎず、旋律の息づかいで自然に間を取る。左手を一定に保ち、右手を歌わせることで、静けさと憂いが保たれる。", "recs": [], "films": [], "cms": [], "textbooks": [], "related": ["グノシエンヌ 第2番・第3番", "ジムノペディ"], "imslp": "https://imslp.org/wiki/Special:Search?search=Gnossienne+No.+1", "trivia": ["楽譜に拍子記号も小節線もない。", "語源には諸説あり、決着していない。", "1893年に3曲がまとめて出版された。"], "sources": ["https://en.wikipedia.org/wiki/Gnossiennes", "https://rtds.jamu.cz/?p=6539"]},
{"cat": "ピアノ独奏", "id": "waltz-64-2", "title": "ワルツ第7番 嬰ハ短調 Op.64-2", "en": "Waltz No. 7 in C-sharp minor, Op. 64 No. 2", "composer": "フレデリック・ショパン", "era": "ロマン派", "year": "1846〜1847", "opus": "Op.64-2", "key": "嬰ハ短調・3/4拍子(Tempo giusto)", "form": "ロンド風(A-B-C-B-A-B。三部形式の趣もある)", "mood": ["切ない", "華やか"], "summary": "哀愁の短調主題と長調の歌がめぐる、後期ショパンの代表的なワルツ。ロスチャイルド夫人に献呈。", "diff": "未確認", "story": "1846年から47年にかけて書かれた、ショパンが生前に発表した最後期のワルツの一つ。Op.64として3曲まとめて1847年にパリのブランデュス社から出版され、第2番は『ナタニエル・ド・ロスチャイルド夫人』に献呈された。献呈相手はロスチャイルド家の一員で、画家・社交家として知られるシャルロット。舞曲でありながら実際に踊るためというより、サロンで聴くためのピアノ曲として書かれている。個別の逸話は多くは確認できなかった。", "pub": "1847年、パリのブランデュス社(Brandus et Cie)から出版(Op.64として3曲)。", "ded": "ナタニエル・ド・ロスチャイルド夫人(シャルロット・ド・ロスチャイルド)", "nameOrigin": "通称は確認できなかった。日本では『第7番』の番号で呼ばれ、『小犬のワルツ』(Op.64-1)と並んで知られる。", "structure": [["主題A", "テンポ・ジュストの和音的な旋律。歩くような感触の短調の主題。"], ["主題B", "より速く(più mosso)、8分音符の流れの中で進む。"], ["主題C", "より遅く(più lento)で、嬰ハ長調(変ニ長調)の歌。間奏のような性格。"], ["全体構成", "A B C B A B の順で現れ、ロンド風だがワルツの三部形式にも似る。"]], "features": "哀愁を帯びた短調の主題と、流れるような急速な部分、長調に転じた歌のような中間部が交替する、変化に富んだワルツ。長調の部分は夢見るように穏やかで、短調の主題が戻ると切なさが一層際立つ。管弦楽版がバレエ『レ・シルフィード』の一部になっている。", "perf": "3拍子の1拍目に重心を置きつつ、メロディーの歌い回しにルバートをかけすぎないようにする。中間のsostenuto部分では、右手の旋律を明るい音色にして対比をつける。速い部分は粒をそろえ、息継ぎを自然に。", "recs": [], "films": [], "cms": [], "textbooks": [], "related": ["ワルツ第6番 変ニ長調 Op.64-1『小犬』", "ワルツ第8番 変イ長調 Op.64-3", "バレエ『レ・シルフィード』", "ワルツ第9番『別れのワルツ』Op.69-1"], "imslp": "https://imslp.org/wiki/Special:Search?search=Waltz+No.+7+in+C-sharp+minor,+Op.+64+No.+2", "trivia": ["Op.64の3曲で最もよく演奏されるのが第2番とされる(演奏頻度の根拠は未確認)。", "Op.64-2は管弦楽編曲がバレエ『レ・シルフィード』に使われている。", "2022年の映画『On the Come Up』では、クロエ・フラワーによる本曲に基づく編曲が使われた。"], "sources": ["https://en.wikipedia.org/wiki/Waltz_in_C-sharp_minor,_Op._64,_No._2_(Chopin)", "https://www.tunefind.com/artist/chopin", "https://filmmusicreporter.com/2022/09/23/chloe-flowers-solo-piano-track-chopins-waltz-from-sanaa-lathans-on-the-come-up-released/"]},
{"cat": "ピアノ独奏", "id": "waltz-69-1", "title": "ワルツ第9番 変イ長調 Op.69-1『別れのワルツ』", "en": "Waltz No. 9 in A-flat major, Op. 69 No. 1 (Farewell Waltz / L'adieu)", "composer": "フレデリック・ショパン", "era": "ロマン派", "year": "1835", "opus": "Op.69-1(遺作)", "key": "変イ長調・3/4拍子(Tempo di valse)", "form": "複合三部形式(主題の反復を伴うワルツ)", "mood": ["切ない", "穏やか"], "summary": "1835年、マリア・ヴォジンスカとの別れに際して書かれたとされるワルツ。ショパンの死後、友人フォンタナが出版した。", "diff": "未確認(ヘンレ版ワルツ集全体は『demanding』との表記があるが、曲別は未確認)", "story": "1835年9月、ドレスデンでマリア・ヴォジンスカに贈るために書かれたとされるワルツ。ショパンはマリアと婚約したと言われるが、詳しい経緯には異説もある。彼女に贈られた自筆譜の表紙には『マリー嬢へ』と記されていた。この自筆譜は現在失われているとする資料があるが(ワルシャワの国立図書館が所蔵するという記述もあり、確認が取れていない)、ほかにも、1837年にエリザ・ペルッツィ、1842年にシャルロット・ド・ロスチャイルドに宛てた別の自筆譜が残る。作曲者の生前には出版されず、1855年、友人ユリアン・フォンタナが遺作として世に出した。", "pub": "1855年、ユリアン・フォンタナによって死後出版(Op.69として2曲)。", "ded": "正式な献呈は未確認。自筆譜は、マリア・ヴォジンスカ(1835年)、エリザ・ペルッツィ(1837年)、シャルロット・ド・ロスチャイルド(1842年)に贈られたものが知られる。", "nameOrigin": "『別れのワルツ(Farewell Waltz / Valse de l'adieu)』の呼称は、ショパン本人の命名ではない。1835年にマリア・ヴォジンスカとの別れの際に贈られた曲とされることに由来する。出版は死後1855年にフォンタナが行い、Op.69は本人が付けた作品番号ではなく、遺作として後から与えられたもの。", "structure": [["主題1", "con espressione。憂いを帯びた懐かしい旋律で、小さな装飾音の上昇で一つの山を作る。"], ["主題2", "sempre delicatissimo。主題1よりやや明るく、すぐに第1主題に戻る。"], ["主題3", "dolce。最も軽やかで遊び心のある旋律。"], ["主題4", "二重音が段階的に上がっていく部分(poco a poco crescendo)で、3の主題に戻って、冒頭へ戻る(ダ・カーポ)。"]], "features": "冒頭の主題は、3拍子の流れの中で寂しさとなつかしさが交ざり合い、聴き手を一気に引き込む。中間の主題は軽やかで、陰りの合間に笑顔がのぞくような対比がある。ワルツの形を借りながら、踊るためというより、手紙のように個人的な感情を込めた作品。ショパンの死後に広まったこともあり、物語性のある呼称とともに愛されている。", "perf": "冒頭は自然な3拍子の呼吸を保ち、感傷に流れすぎないこと。第3主題以降は軽く、二重音の上昇部分は音量を作りすぎず歌わせる。ダ・カーポで戻る冒頭は、最初より一段落ち着いた音色にする。", "recs": [], "films": [], "cms": [], "textbooks": [], "related": ["ワルツ第10番 ロ短調 Op.69-2", "ワルツ集 Op.64", "マリア・ヴォジンスカとの婚約", "ワルツ第6番『小犬』"], "imslp": "https://imslp.org/wiki/Waltzes,_Op.69_(Chopin,_Fr%C3%A9d%C3%A9ric)", "trivia": ["ペルッツィ宛(1837)とロスチャイルド宛(1842)に、別バージョンの自筆譜が残っている。", "フォンタナの死後出版版は、確認できる自筆譜に基づくものではないとされる。", "Op.69の2曲は1829年(第2番)と1835年(第1番)の作で、いずれも1855年に出版された。"], "sources": ["https://en.wikipedia.org/wiki/Waltzes,_Op._69_(Chopin)", "https://imslp.org/wiki/Waltzes,_Op.69_(Chopin,_Fr%C3%A9d%C3%A9ric)", "https://enc.piano.or.jp/en/musics/23221"]},
{"cat": "ピアノ独奏", "id": "tchaikovsky-october", "title": "四季 Op.37a 第10曲 10月「秋の歌」", "en": "The Seasons, Op.37a, No.10 October: Autumn Song", "composer": "ピョートル・チャイコフスキー", "era": "ロマン派", "year": "1876（全曲は1875年12月〜1876年5月作曲）", "opus": "Op.37a（Op.37bとも表記）/ TH 135", "key": "ニ短調、Andante doloroso e molto cantabile、56小節（拍子は未確認）", "form": "四季の曲の多くは単純なABA形式とされるが、この曲の楽式は未確認", "mood": ["切ない"], "summary": "チャイコフスキーが雑誌の依頼で書いた十二か月の小品のうち、ニ短調で秋の寂しさを歌う10月の曲。", "diff": "未確認", "story": "四季は、サンクトペテルブルクの音楽雑誌『ヌヴェリスト』の編集者ニコライ・ベルナールが1875年に依頼した、各月を描く12の小品である。題は編集者の案で、チャイコフスキーは1875年12月の手紙で全ての題を受け入れると伝えた。その1月から2月の曲が先に送られ、後半の7曲は同じ帳面に記されていて、白鳥の湖の管弦楽化を4月22日頃に終えたのち、5月下旬までにまとめて書かれたと推定される。6月号が5月末に検閲を通っているためである。10月の曲は詩人A・K・トルストイの詩句がエピグラフに付されたが、これも作曲者でなく編集者の選択だった。1876年中に雑誌に連載され、1886年にユルゲンソンが権利を得てOp.37aとして出版した。", "pub": "1876年に『ヌヴェリスト』誌で毎月連載。同年10〜11月に単行出版の検閲許可。1886年にユルゲンソン社がOp.37aとして再出版", "ded": "未確認", "nameOrigin": "「秋の歌」の題は、依頼した編集者ニコライ・ベルナールの提案で、チャイコフスキーが受け入れたもの。エピグラフ（A・K・トルストイの詩句）もベルナールの選。", "structure": [["標題とエピグラフ", "「秋の歌」。A・K・トルストイの、荒れた庭に黄色い葉が風に舞う、という趣旨の詩句が添えられる"], ["速度と調", "Andante doloroso e molto cantabile、ニ短調、56小節"], ["四季全体での位置", "秋の中盤を担う10曲目。次の11曲目は「トロイカ」"], ["原稿", "10月を含む11曲の自筆譜はモスクワの国立音楽博物館に現存（4月のみ紛失）"]], "features": "ニ短調で、悲しげに十分に歌う、という発想標語が付く。四季の中でも特に物悲しい一曲として知られる。短い曲だが旋律が前面にあり、ロシアの秋の寂しさを歌曲のように描く。依頼仕事として書かれた小品集ながら、旋律の美しさから単独でもよく弾かれ、他の楽器への編曲も多い。", "perf": "発想標語は「悲しげに、かつ十分に歌って」の意。旋律の息づかいを大切に、伴奏は旋律を支える程度に抑えて歌い込む。感傷に流れすぎず、音色の変化で哀愁を出したい。", "recs": [], "films": [], "cms": [], "textbooks": [], "related": ["四季 6月「舟歌」", "四季 11月「トロイカ」", "四季 3月「ひばりの歌」", "子供のためのアルバム Op.39"], "imslp": "https://imslp.org/wiki/The_Seasons,_Op.37a_(Tchaikovsky,_Pyotr)", "trivia": ["各曲の題と詩の引用は作曲者ではなく編集者が決めた。", "カシュキンが伝えた、従者に催促されて毎月1曲ずつ書いたという逸話は、資料から裏付けにくいとされる。", "四季の自筆譜は4月の曲のみ失われている。"], "sources": ["https://en.tchaikovsky-research.net/pages/The_Seasons", "https://en.wikipedia.org/wiki/The_Seasons_(Tchaikovsky)"]},
{"cat": "ピアノ独奏", "id": "k310-2", "title": "ピアノ・ソナタ第8番 イ短調 K.310 第2楽章 アンダンテ・カンタービレ・コン・エスプレッシオーネ", "en": "Piano Sonata No. 8 in A minor, K. 310 (300d), II. Andante cantabile con espressione", "composer": "ヴォルフガング・アマデウス・モーツァルト", "era": "古典派", "year": "1778", "opus": "K.310 / 300d", "key": "ヘ長調 3/4（ソナタ全体はイ短調）", "form": "緩徐楽章（内部の詳細な形式は未確認）", "mood": ["切ない", "穏やか"], "summary": "母の死の頃に書かれたイ短調ソナタの中央で、ヘ長調の歌が静かに流れる緩徐楽章。モーツァルトの数少ない短調ソナタの陰影を和らげる。", "diff": "未確認", "story": "1778年の夏、パリ滞在中に書かれた。母アンナ・マリアが亡くなった時期と重なり、モーツァルトにとって最も辛い時期の一つにあたる。モーツァルトのピアノ・ソナタで短調のものは、この曲と第14番K.457の2曲だけで、同時期のヴァイオリン・ソナタ第21番ホ短調K.304とあわせ、母の突然の死が曲の暗い色合いに影響したのではないかと言われている。ただし、書簡でこの曲にほとんど触れられていないため、作曲の細かな事情はよく分かっていない。自筆譜はニューヨークのモルガン・ライブラリー＆ミュージアムに所蔵され、交響曲第31番K.297と同じ種類の、パリで買った紙が使われている。", "pub": "初版は未確認（1792年頃のアルタリア版がハーバード図書館に所蔵）", "ded": "未確認", "nameOrigin": "愛称はない。K.310/300dはケッヘル番号の旧番号と改訂番号の併記。", "structure": [["ソナタ全体", "第1楽章Allegro maestoso（イ短調4/4）、第2楽章Andante cantabile con espressione（ヘ長調3/4）、第3楽章Presto（2/4）の3楽章。"], ["本楽章の位置", "短調の両端楽章にはさまれたヘ長調の緩徐楽章。"], ["発想標語", "「歌うように、表情豊かに」を意味し、旋律の歌わせ方が主眼にある。"]], "features": "両端楽章がイ短調の悲痛なソナタの中で、ヘ長調の穏やかな歌を聴かせる緩徐楽章。標語どおり旋律の歌い方が中心で、全曲の緊張を和らげる役割がある。母の死との関係はあくまで推測とされ、楽章ごとの具体的な感情表現と結びつける確かな出典は確認できなかった。", "perf": "3/4拍子の流れを保ち、旋律線を歌わせて左手の伴奏を支えに回す。強弱の対比は表情標語に沿って丁寧につけ、全曲の短調楽章との性格の違いを意識すると楽章の位置づけが伝わる。", "recs": [], "films": [["ボーンズ 骨は語る（TVドラマ）S11E20「The Stiff in the Cliff」", "2016", "結婚式のドレスを試着するシーンで使用（Tunefindの記載。グールド録音）", "https://www.tunefind.com/show/bones/season-11/32734#102180"]], "cms": [], "textbooks": [], "related": ["ピアノ・ソナタ第14番 ハ短調 K.457", "ヴァイオリン・ソナタ第21番 ホ短調 K.304", "ピアノ・ソナタ第7番 ハ長調 K.309"], "imslp": "https://imslp.org/wiki/Piano_Sonata_No.8_in_A_minor,_K.310/300d_(Mozart,_Wolfgang_Amadeus)", "trivia": ["モーツァルトのピアノ・ソナタで短調なのは、K.310とK.457の2曲のみ。", "自筆譜はモルガン・ライブラリー＆ミュージアムが所蔵している。", "全曲の演奏時間は約22分とされる。"], "sources": ["https://en.wikipedia.org/wiki/Piano_Sonata_No._8_(Mozart)", "https://www.tunefind.com/song/glenn-gould/sonata-no-8-in-a-minor-for-piano-k-310-300d-ii-andante-cantabile-con-espressione", "https://imslp.org/wiki/Piano_Sonata_No.8_in_A_minor,_K.310/300d_(Mozart,_Wolfgang_Amadeus)"]},
{"cat": "ピアノ独奏", "id": "schubert-impromptu-90-3", "title": "4つの即興曲 Op.90 D.899 第3番 変ト長調", "en": "Impromptu in G-flat major, Op.90 No.3, D.899", "composer": "フランツ・シューベルト", "era": "ロマン派（初期ロマン派）", "year": "1827", "opus": "Op.90 / D.899-3", "key": "変ト長調、Andante、4/2拍子（alla breve）", "form": "夜想曲を思わせる歌曲風の小品。展開部のない序曲形式に近いとされる（ドイツ語版Wikipedia）", "mood": ["穏やか", "夜"], "summary": "変ト長調の長い旋律が、竪琴のような分散和音に乗って流れるシューベルト晩年の歌。映画でもおなじみの一曲。", "diff": "未確認", "story": "シューベルトは1827年に、のちにD.899（Op.90）とD.935（Op.142）となる各4曲、計8曲の即興曲を書いた。D.899のうち、生前に出版されたのは最初の2曲だけで、第3番と第4番は1857年にようやく出版された。第3番はその際、変ト長調ではなくト長調に移して印刷され、長い間その調の楽譜しか流通しなかった。ドイツ語版Wikipediaは、出版社ハスリンガーが原調を複雑すぎると考え、弾きやすさのため移調を勧めたと説明する。即興曲という呼称もハスリンガーに由来する。変ト長調の長い旋律線と途切れない分散和音の伴奏が特徴で、第1番や第2番とともに今日も広く演奏される。", "pub": "Op.90の第1・2番はシューベルト存命中に出版（出版社はハスリンガー）。第3・4番は1857年に出版され、第3番は長くト長調で流通した", "ded": "未確認", "nameOrigin": "「即興曲（Impromptu）」という名称は、D.899の4曲についてはウィーンの出版社トビアス・ハスリンガーによるとされる（ドイツ語版Wikipedia）。通称の「秋」「夜」のような愛称は確認できなかった。", "structure": [["拍子と速度", "Andante、4/2拍子（alla breve）。ゆったり流れる"], ["旋律と伴奏", "右手が旋律と伴奏を同時に受け持つ。5指が旋律を歌い、他の指が竪琴のような分散和音を奏でる"], ["和声", "旋律の下で、新しい和声の動きが加わり表情を変えていく"], ["形式感", "第1番や第3番は、展開部のない序曲形式に近い（ドイツ語版Wikipedia）"]], "features": "静かな夜想曲風の歌で、長い旋律線と途切れない三和音の分散伴奏が続く。旋律は一貫して歌い、和声の移ろいが陰影を与える。同じ右手で旋律と伴奏を弾くピアノ的な魅力があり、映画の場面にもたびたび使われている。", "perf": "5指で歌う旋律を、内側の分散和音より前へ出して保つことが要点。伴奏の音量と均一さを保ちつつ、歌心を失わないようにする。ペダルは和声の変化を濁さぬよう慎重に。", "recs": [], "films": [["ガタカ", "1997", "12本指のピアニストの演奏会の場面（マイケル・ナイマン編曲版。英語版Wikipediaの記載による）", "https://en.wikipedia.org/wiki/Impromptus_(Schubert)"], ["愛、アムール", "2012", "第1番・第3番が使用され、アレクサンドル・タロー演奏でサウンドトラック化", "https://en.wikipedia.org/wiki/Impromptus_(Schubert)"], ["The Lady in the Van", "2015", "作中で第3番が演奏され、サウンドトラックにも収録", "https://en.wikipedia.org/wiki/Impromptus_(Schubert)"]], "cms": [], "textbooks": [], "related": ["即興曲 D.899 第1番 ハ短調", "即興曲 D.899 第2番 変ホ長調", "即興曲 D.935 Op.142", "楽興の時 D.780", "3つのピアノ曲 D.946"], "imslp": "https://imslp.org/wiki/4_Impromptus,_D.899_(Schubert,_Franz)", "trivia": ["第3番は出版時にト長調に移され、長年その調で流通した。", "Manfred Mann's Earth Bandの1976年の曲「Questions」は、この変ト長調の即興曲の主題が基になっている。", "映画『ガタカ』では、ナイマン編曲版の演奏が『12本の指でなければ弾けない』と語られる。"], "sources": ["https://en.wikipedia.org/wiki/Impromptus_(Schubert)", "https://de.wikipedia.org/wiki/Impromptus_(Schubert)"]},
{"cat": "ピアノ独奏", "id": "brahms-op118-2", "title": "6つの小品 Op.118 第2番 間奏曲 イ長調", "en": "Intermezzo in A major, Op. 118 No. 2", "composer": "ヨハネス・ブラームス", "era": "ロマン派", "year": "1893", "opus": "Op.118-2", "key": "イ長調（拍子は未確認）", "form": "未確認", "mood": ["切ない", "夜"], "summary": "晩年のブラームスが静かな休暇先で書いた小品集の中の最も有名な1曲。優しく内省的な旋律で、秘めた想いのようだと語られる。", "diff": "ヘンレ難易度6（中級）", "story": "Op.118は1893年の夏、ブラームスが休暇を過ごしたバート・イシュルで書かれた晩年のピアノ小品集。作品を耳にした同時代の人々は喜び、クララ・シューマンは最初に新作に触れることを許された一人で、「ごく小さな規模に豊かな感情が詰まっている」と評したと、ヘンレ社の解説は伝えている。哲学者でもあったフィリップ・シュピッタは、これらの曲を「孤独と静けさの中でゆっくり味わうのにふさわしい」と評した。この第2番イ長調は、第5番ヘ長調のロマンツェと並び、曲集中でも最もよく知られた小品で、クララへの秘めた恋文のようだとも言われる（この見方は解説サイトの記述で、根拠は未確認）。", "pub": "未確認", "ded": "クララ・シューマン（検索結果に記載。一次資料は未確認）", "nameOrigin": "「間奏曲（インテルメッツォ）」は、小さな性格的小品に対する呼称。発想標語は「Andante teneramente（歩く速さで、優しく）」。", "structure": [["曲集内の位置", "Op.118の6曲のうち第2番。第1番イ短調（難易度7）、第3番バラード（7）、第4番へ短調（6）、第5番ロマンツェ（6）、第6番変ホ短調と続く。"], ["発想標語", "Andante teneramente。"], ["内部構成", "未確認（出典から確認できなかった）。"]], "features": "Op.118のなかで最も知られる小品の一つで、晩年のブラームスの内省的な作風を代表する。ヘンレ社の難易度は6（中級）で、音楽的な深みに比べて技術的な負担は比較的軽い。映画『ラスト、コーション』(2007) のサウンドトラックにも収録された。", "perf": "旋律を内声と一体で歌わせ、感情を表に出しすぎず柔らかく保つのが要点。長いフレーズを息づかいで運び、強弱は小さな幅の中で微妙に移ろわせる。", "recs": [["スティーヴン・コヴァセヴィチ", "1981", "YouTubeに1981年の演奏として掲載。"], ["アラン・プラネス", "2007", "映画『ラスト、コーション』サウンドトラックの演奏（6分10秒）。"]], "films": [["ラスト、コーション（色・戒）", "2007", "サウンドトラックの4曲目に収録（アラン・プラネス演奏）。場面は未確認", "https://www.soundtrackcollector.com/title/80951/"]], "cms": [], "textbooks": [], "related": ["ブラームス 6つの小品 Op.118 第5番 ロマンツェ ヘ長調", "ブラームス 16のワルツ Op.39 第15番", "クララ・シューマンの作品"], "imslp": "https://imslp.org/wiki/Special:Search?search=Intermezzo+in+A+major,+Op.+118+No.+2", "trivia": ["Op.118は1893年にバート・イシュルで書かれた。", "ヘンレ社は第2番と第5番を曲集の中で最も有名な小品としている。", "映画『ラスト、コーション』のサントラでは、デスプラのスコアの合間に収録されている。"], "sources": ["https://www.henle.de/us/Piano-Pieces-op.-118/HN-1215", "https://www.soundtrackcollector.com/title/80951/", "https://interlude.hk/brahms-late-piano-works-klavierstucke-op-118/"]}

const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function autolink(text, selfId){
  if (!text) return text;
  const pairs = [];
  SONGS.forEach(s=>{ if (s.id===selfId) return; (ALIASES[s.id]||[]).forEach(k=>pairs.push([k,s.id])); });
  pairs.sort((a,b)=>b[0].length-a[0].length);
  const map = {}; pairs.forEach(p=>{ if(!map[p[0]]) map[p[0]]=p[1]; });
  const re = new RegExp(Object.keys(map).map(esc).join('|'),'g');
  return text.replace(re, m=>'<a class="ilink" href="#/song/'+map[m]+'">'+m+'</a>');
}

function route(){
  const i = currentViewIdx();
  document.title = (i>=0 ? SONGS[i].title + '｜' : '') + 'SUBURBIA CLASSICA — A Mellow Classical Selection';
  if (i >= 0) {
    renderSong(i);
    if (started) { if (cur !== i) playSong(i); }
    else if (ytReady) setNow(i, false);
  } else {
    const m = location.hash.match(/^#\/(composer|mood|cat)\/(.+)$/);
    if (m) renderList(m[1], decodeURIComponent(m[2])); else renderList();
    if (!started && ytReady && cur < 0) setNow(0, false);
  }
  window.scrollTo(0, 0);
}

const rg = (c,x,y,r,col0,col1)=>{const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,col0);g.addColorStop(1,col1);return g};

const SS = {on:false, manual:false, art:null, st:null, raf:0, t0:0, W:0, H:0, idle:0, sw:0};
const ssEl=$('#ss'), cv=$('#ssc'), cx=cv.getContext('2d');
function ssResize(){const d=Math.min(window.devicePixelRatio||1,1.5);cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);SS.W=innerWidth;SS.H=innerHeight;}
function ssSet(i){
  const s=SONGS[i], spec=ART_BY_ID[s.id]||'bokeh', name=typeof spec==='string'?spec:spec.art, a=ARTS[name]; SS.art=a;
  cx.globalCompositeOperation='source-over';cx.globalAlpha=1;cx.clearRect(0,0,SS.W,SS.H);
  SS.st=a.init(SS.W,SS.H,mk(i*97+13),typeof spec==='string'?null:spec.pal); SS.t0=performance.now();
  ssEl.classList.toggle('light',!!(a.light||(spec.pal&&spec.pal.light)));
  $('#ssTj').textContent=s.title; $('#ssTe').textContent=s.en.split(' — ')[0].replace(/^Piano Sonata.*$/,s.en); $('#ssTc').textContent=s.composer;
}
function ssLoop(now){ if(!SS.on) return; SS.art.draw(cx,SS.W,SS.H,(now-SS.t0)/1000,SS.st); SS.raf=requestAnimationFrame(ssLoop); }
function ssShow(manual){
  if(SS.on) return; SS.on=true; SS.manual=!!manual; SS.idle=0;
  ssResize(); ssSet(cur<0?0:cur); ssEl.classList.add('on'); ssEl.setAttribute('aria-hidden','false');
  SS.raf=requestAnimationFrame(ssLoop);
  if(manual && ssEl.requestFullscreen) ssEl.requestFullscreen().catch(()=>{});
}
function ssHide(){
  if(!SS.on) return; SS.on=false; cancelAnimationFrame(SS.raf); clearTimeout(SS.sw);
  ssEl.classList.remove('on'); ssEl.setAttribute('aria-hidden','true'); SS.idle=0;
  if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
}
function ssSwap(i){ // 曲が変わったらアートをクロスフェード
  clearTimeout(SS.sw); cv.style.opacity=0; $('#ssInfo').style.opacity=0;
  SS.sw=setTimeout(()=>{ if(!SS.on) return; ssSet(i); cv.style.opacity=1; $('#ssInfo').style.opacity=1; },850);
}
let lx=-1,ly=-1;
addEventListener('mousemove',e=>{
  if(SS.on){ if(!SS.manual && lx>=0 && Math.hypot(e.clientX-lx,e.clientY-ly)>8) ssHide(); }
  else SS.idle=0;
  if(lx<0||!SS.on){lx=e.clientX;ly=e.clientY;}
});
['mousedown','touchstart','wheel'].forEach(ev=>addEventListener(ev,()=>{ if(SS.on) ssHide(); else SS.idle=0; },{passive:true}));
addEventListener('keydown',()=>{ if(SS.on) ssHide(); else SS.idle=0; });
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement && SS.on && SS.manual) ssHide(); });
addEventListener('resize',()=>{ if(SS.on){ ssResize(); ssSet(cur<0?0:cur); } });
$('#bShow').onclick=()=>{ lx=-1; ssShow(true); };
setInterval(()=>{ if(!SS.on && $('#saver').checked && started && playing){ if(++SS.idle>=20){ lx=-1; ssShow(false); } } else if(!playing) SS.idle=0; },1000);
if(/[?&]display=1/.test(location.search)) setTimeout(()=>ssShow(true),300);

route();
