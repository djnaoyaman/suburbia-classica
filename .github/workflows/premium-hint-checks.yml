name: Check transient Premium hint
on:
  pull_request:
    paths: ['index.html', 'premium-playback-hint.*', 'tests/test-premium-hint*.cjs', '.github/workflows/premium-hint-checks.yml']
  push:
    branches: [main]
    paths: ['index.html', 'premium-playback-hint.*', 'tests/test-premium-hint*.cjs', '.github/workflows/premium-hint-checks.yml']
permissions:
  contents: read
jobs:
  hint:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test-premium-hint.cjs && node tests/test-playback-seek.cjs
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/test-premium-hint-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-hint-screenshots
          path: test-artifacts/
          if-no-files-found: warn
